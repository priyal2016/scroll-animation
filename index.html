
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .animation-section {
      height: 400vh;
      position: relative;
    }

    .animation-screen {
      width: 100%;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .loading {
      position: absolute;
      color: white;
      font: 16px Arial, sans-serif;
      z-index: 2;
    }
  </style>
</head>

<body>

  <section class="animation-section">
    <div class="animation-screen">
      <div class="loading" id="loading">Loading animation...</div>
      <canvas id="animation"></canvas>
    </div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const frameCount = 240;
    const canvas = document.getElementById("animation");
    const context = canvas.getContext("2d");
    const loading = document.getElementById("loading");

    const images = [];
    const playhead = { frame: 0 };

    const frameUrl = (index) => {
      const number = String(index + 1).padStart(3, "0");
      return `frames/ezgif-frame-${number}.jpg`;
    };

    function drawFrame(index) {
      const image = images[index];

      if (!image || !image.complete || !image.naturalWidth) {
        return;
      }

      const width = canvas.width;
      const height = canvas.height;

      context.clearRect(0, 0, width, height);

      // Fill the canvas without stretching the image.
      const scale = Math.max(
        width / image.naturalWidth,
        height / image.naturalHeight
      );

      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;

      context.drawImage(
        image,
        (width - drawWidth) / 2,
        (height - drawHeight) / 2,
        drawWidth,
        drawHeight
      );
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth * Math.min(window.devicePixelRatio || 1, 2);
      canvas.height = window.innerHeight * Math.min(window.devicePixelRatio || 1, 2);
      drawFrame(Math.round(playhead.frame));
    }

    for (let i = 0; i < frameCount; i++) {
      const image = new Image();
      image.src = frameUrl(i);

      image.onload = () => {
        if (i === 0) {
          loading.style.display = "none";
        }

        if (Math.round(playhead.frame) === i) {
          drawFrame(i);
        }
      };

      images.push(image);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    gsap.to(playhead, {
      frame: frameCount - 1,
      snap: "frame",
      ease: "none",
      scrollTrigger: {
        trigger: ".animation-section",
        start: "top top",
        end: "bottom bottom",
        scrub: true
      },
      onUpdate: () => {
        drawFrame(Math.round(playhead.frame));
      }
    });
  </script>

</body>
</html>
